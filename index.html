  // --- File list with optgroups ---
  window.refreshFileList = async function() {
      try {
          const configs = await api.listConfigs().catch(() => []);
          const selector = document.getElementById('file_selector');
          const currentVal = selector.value;
          selector.innerHTML = '';

          // Inventory optgroup
          const invGroup = document.createElement('optgroup');
          invGroup.label = 'Inventaire';
          const invOpt = document.createElement('option');
          invOpt.value = '__inventory__';
          invOpt.textContent = 'Infrastructure Septeo (live)';
          invGroup.appendChild(invOpt);
          selector.appendChild(invGroup);

          // User projects optgroup
          const projGroup = document.createElement('optgroup');
          projGroup.label = 'Mes Projets';
          const cfgList = Array.isArray(configs) ? configs : [];
          if (cfgList.length === 0) {
              const emptyOpt = document.createElement('option');
              emptyOpt.disabled = true;
              emptyOpt.textContent = 'Aucun projet';
              projGroup.appendChild(emptyOpt);
          } else {
              cfgList.forEach(cfg => {
                  const option = document.createElement('option');
                  option.value = cfg.id || cfg.Titre;
                  option.innerText = cfg.Titre || cfg.id;
                  option.dataset.configId = cfg.id || '';
                  projGroup.appendChild(option);
              });
          }
          selector.appendChild(projGroup);

          if (currentVal) {
              selector.value = currentVal;
          } else {
              selector.value = '__inventory__';
          }
      } catch (err) {
          console.error("Error listing configs:", err);
      }
  };

  // --- Load selected file or inventory ---
  window.loadSelectedFile = async function() {
      const selector = document.getElementById('file_selector');
      const selectedOption = selector.options[selector.selectedIndex];
      if (!selectedOption || !selectedOption.value) return;

      const val = selectedOption.value;

      if (val === '__inventory__') {
          setInventoryMode(true);
          window._currentConfigId = null;
          window._currentConfigTitre = 'Infrastructure Septeo';

          try {
              const invData = await buildInventoryProject();
              window._inventoryJSON = invData;
              const jsonEditor = document.getElementById('json_editor');
              jsonEditor.value = JSON.stringify(invData, null, 4);

              const visualTab = document.getElementById('tab_visual');
              if (visualTab.classList.contains('active')) {
                  if (!window.builder.scene) {
                      window.builder.init();
                  } else {
                      setTimeout(() => window.builder.updateFromJSON(true), 10);
                  }
              }
          } catch(err) {
              console.error("Error building inventory:", err);
              alert("Impossible de charger l'inventaire : " + err.message);
          }
          return;
      }

      setInventoryMode(false);
      const configId = selectedOption.dataset.configId || val;
      console.log("Loading config:", configId);

      try {
          const config = await api.loadConfig(configId);
          const jsonEditor = document.getElementById('json_editor');

          let jsonData;
          if (typeof config.Json === 'string') {
              jsonData = JSON.parse(config.Json);
          } else if (config.Json) {
              jsonData = config.Json;
          } else {
              jsonData = config;
          }

          jsonEditor.value = JSON.stringify(jsonData, null, 4);
          window._currentConfigId = configId;
          window._currentConfigTitre = config.Titre || selectedOption.value;

          const visualTab = document.getElementById('tab_visual');
          if (visualTab.classList.contains('active')) {
              if (!window.builder.scene) {
                  window.builder.init();
              } else {
                  setTimeout(() => window.builder.updateFromJSON(true), 10);
              }
          }
      } catch (err) {
          console.error("Error loading config:", err);
      }
  };

  // --- Fork inventory into editable project ---
  window.forkInventoryToProject = async function() {
      if (!window._inventoryJSON) {
          alert("Aucun inventaire chargé.");
          return;
      }
      const name = prompt("Nom du nouveau projet :", "Projet depuis inventaire");
      if (!name) return;

      try {
          const jsonCopy = JSON.parse(JSON.stringify(window._inventoryJSON));
          const result = await api.saveConfig(name, jsonCopy);
          if (result && result.id) {
              window._currentConfigId = result.id;
              window._currentConfigTitre = name;
          }
          setInventoryMode(false);
          await refreshFileList();
          const selector = document.getElementById('file_selector');
          if (result && result.id) {
              for (let i = 0; i < selector.options.length; i++) {
                  if (selector.options[i].value === result.id) {
                      selector.selectedIndex = i;
                      break;
                  }
              }
          }
          alert("Projet créé ! Vous pouvez maintenant le modifier librement.");
      } catch(err) {
          alert("Erreur : " + err.message);
      }
  };

  window.saveFile = async function() {
      if (window._isInventoryMode) {
          if (confirm("L'inventaire est en lecture seule. Voulez-vous créer un nouveau projet à partir de celui-ci ?")) {
              forkInventoryToProject();
          }
          return;
      }

      const selector = document.getElementById('file_selector');
      const content = document.getElementById('json_editor').value;
      const titre = window._currentConfigTitre || selector.options[selector.selectedIndex]?.text || 'untitled';

      if (!content) {
          alert("Aucun contenu à sauvegarder !");
          return;
      }

      try {
          JSON.parse(content);
      } catch(e) {
          alert("JSON invalide, impossible de sauvegarder.");
          return;
      }

      try {
          if (window._currentConfigId) {
              await api.deleteConfig(window._currentConfigId);
          }
          const result = await api.saveConfig(titre, content);
          if (result && result.id) {
              window._currentConfigId = result.id;
          }
          alert("Configuration sauvegardée !");
          refreshFileList();
      } catch (err) {
          alert("Erreur de sauvegarde: " + err.message);
      }
  };

  window.applyJsonChanges = function() {
      const jsonEditor = document.getElementById('json_editor');
      try {
          JSON.parse(jsonEditor.value);
          if (window.builder.scene) {
              window.builder.updateFromJSON(true);
          }
      } catch (e) {
          alert("Erreur JSON: " + e.message);
      }
  };

  window.openTab = function(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.getElementById('tab_' + tabName).classList.add('active');

      const buttons = document.querySelectorAll('.tab-btn');
      if (tabName === 'visual') {
          buttons[0].classList.add('active');
          window.builder.init();
      }
      if (tabName === 'json') buttons[1].classList.add('active');
  };

  window.publishPresentation = async function() {
      const content = document.getElementById('json_editor').value;
      if (!content) {
          alert("Aucun projet ouvert à publier.");
          return;
      }
      try {
          JSON.parse(content);
      } catch(e) {
          alert("JSON invalide.");
          return;
      }

      try {
          const titre = window._currentConfigTitre || 'Presentation';
          const result = await api.publishPresentation(titre, content);
          if (result && result.id) {
              const url = window.location.origin + '/p/' + result.id;
              prompt("Présentation publiée ! Copiez l'URL :", url);
          } else {
              alert("Présentation publiée.");
          }
      } catch(err) {
          alert("Erreur publication: " + err.message);
      }
  };

  // Auto-load config from URL params: ?config=id
  const urlParams = new URLSearchParams(window.location.search);
  const autoFile = urlParams.get('file') || urlParams.get('config');

  async function initApp() {
      await refreshFileList();
      window.builder.init(true);

      if (autoFile) {
          const selector = document.getElementById('file_selector');
          for (let i = 0; i < selector.options.length; i++) {
              if (selector.options[i].value === autoFile || selector.options[i].text === autoFile) {
                  selector.selectedIndex = i;
                  loadingHide();
                  window.loadSelectedFile();
                  return;
              }
          }
          loadingHide();
      } else {
          setInventoryMode(true);
          window._currentConfigId = null;
          window._currentConfigTitre = 'Infrastructure Septeo';
          const selector = document.getElementById('file_selector');
          selector.value = '__inventory__';

          try {
              const invData = await buildInventoryProject(true);
              window._inventoryJSON = invData;
              const jsonEditor = document.getElementById('json_editor');
              jsonEditor.value = JSON.stringify(invData, null, 4);

              if (!window.builder.scene) {
                  window.builder.init();
              } else {
                  window.builder.updateFromJSON(true);
              }

              await new Promise(r => setTimeout(r, 200));

              window.builder.currentView = 'physical';
              window.builder._physicalViewLevel = 'globe';
              document.getElementById('btn_physical_view')?.classList.add('active');
              document.getElementById('btn_logical_view')?.classList.remove('active');
              window.builder.renderTree();

              if (window.builder._currentInfra) {
                  window.builder._currentInfra.showGlobeView();
              }
              await window.builder._applyViewVisibility();
              if (window.builder.scene && window.builder.scene.scene) {
                  window.builder.scene.scene.updateMatrixWorld(true);
              }

              const gc = window.builder._getGlobeWorldCenter();
              if (window.builder.scene && window.builder.scene.camera) {
                  window.builder.scene.camera.position.set(gc.x, gc.y, gc.z + 80);
                  if (window.builder.scene.controls) {
                      window.builder.scene.controls.target.copy(gc);
                      window.builder.scene.controls.update();
                  }
              }

              await new Promise(r => setTimeout(r, 100));
              loadingHide();
              hideApiMonitorIfClean();

              await new Promise(r => setTimeout(r, 400));

              window.builder._animateCameraWithOrbit(
                  new THREE.Vector3(gc.x, gc.y + 18, gc.z + 32),
                  gc.clone(),
                  2500
              );
              window.builder._applyGlobeControls(2600);

              await new Promise(r => setTimeout(r, 800));
              if (window.builder._currentInfra) {
                  window.builder._startGlobeIdleAnimation();
              }
          } catch(err) {
              console.error("Error building inventory:", err);
              loadingHide();
          }
      }
  }

  // --- API Monitor panel ---
  const monitorRows = {};
  let _monitorHasErrors = false;
  function initApiMonitor() {
      const panel = document.getElementById('api_monitor');
      if (panel) {
          panel.classList.add('loading-mode', 'visible');
      }
      api.onRequest((evt) => {
          const panel = document.getElementById('api_monitor');
          const body = document.getElementById('api_monitor_body');
          if (!panel || !body) return;

          panel.classList.add('visible');

          const shortUrl = evt.url.replace('https://api-infra.septeo.fr', '');
          const key = evt.method + ':' + evt.url;

          if (evt.status === 'pending') {
              const row = document.createElement('div');
              row.className = 'api-row pending';
              row.innerHTML = `<span class="api-icon"><i class="fas fa-spinner fa-spin"></i></span>`
                  + `<span class="api-url" title="${evt.url}">${shortUrl}</span>`
                  + `<span class="api-count"></span>`
                  + `<span class="api-status">...</span>`
                  + `<span class="api-dur"></span>`
                  + `<span class="api-view-wrap"></span>`;
              body.appendChild(row);
              monitorRows[key] = row;
              body.scrollTop = body.scrollHeight;
          } else {
              const row = monitorRows[key];
              if (!row) return;
              const isOk = typeof evt.status === 'number' && evt.status >= 200 && evt.status < 400;
              row.className = 'api-row ' + (isOk ? 'ok' : 'fail');
              row.querySelector('.api-icon').innerHTML = isOk
                  ? '<i class="fas fa-check-circle"></i>'
                  : '<i class="fas fa-times-circle"></i>';
              row.querySelector('.api-status').textContent = evt.status;
              row.querySelector('.api-dur').textContent = evt.duration + 'ms';
              if (evt.resultCount != null) {
                  row.querySelector('.api-count').textContent = evt.resultCount + ' res.';
              }
              const viewWrap = row.querySelector('.api-view-wrap');
              if (evt.resultData != null) {
                  const btn = document.createElement('button');
                  btn.className = 'api-view-btn';
                  btn.textContent = '🔍';
                  btn.title = 'Voir les données';
                  btn.onclick = () => showApiDetail(shortUrl, evt.resultData);
                  viewWrap.appendChild(btn);
              }
              if (!isOk && evt.requestDetail) {
                  const errBtn = document.createElement('button');
                  errBtn.className = 'api-view-btn';
                  errBtn.style.borderColor = 'rgba(255,80,80,0.4)';
                  errBtn.style.color = '#f66';
                  errBtn.textContent = '📋';
                  errBtn.title = 'Rapport d\'erreur';
                  errBtn.onclick = () => showApiErrorReport(shortUrl, evt.requestDetail);
                  viewWrap.appendChild(errBtn);
              }
              if (evt.error) {
                  row.querySelector('.api-url').title = evt.error;
              }
              if (!isOk) _monitorHasErrors = true;
          }

          const counter = document.getElementById('api_monitor_count');
          if (counter) {
              const total = body.children.length;
              const done = body.querySelectorAll('.api-row.ok').length;
              const failed = body.querySelectorAll('.api-row.fail').length;
              counter.textContent = `${done + failed}/${total}` + (failed > 0 ? ` (${failed} err)` : '');
          }
      });
  }
  function showApiDetail(url, data) {
      const panel = document.getElementById('api_detail_panel');
      const header = document.getElementById('api_detail_url');
      const body = document.getElementById('api_detail_body');
      if (!panel || !body) return;
      if (header) header.textContent = url;
      const items = Array.isArray(data) ? data : (data && data.data ? data.data : [data]);
      let html = `<div style="color:#6af;margin-bottom:8px;">${items.length} élément(s)</div>`;
      if (items.length > 0) {
          const keys = Object.keys(items[0]);
          html += `<div style="color:#888;margin-bottom:6px;">Clefs: ${keys.join(', ')}</div>`;
      }
      for (let i = 0; i < Math.min(items.length, 50); i++) {
          html += `<div style="border-bottom:1px solid rgba(255,255,255,0.05);padding:4px 0;margin-bottom:4px;">`;
          html += `<span style="color:#e8a840;">#${i + 1}</span> `;
          const obj = items[i];
          for (const [k, v] of Object.entries(obj)) {
              const val = v === null ? '<i style="color:#666">null</i>' : String(v).substring(0, 120);
              html += `<div style="padding-left:12px;"><span style="color:#6af">${k}</span>: ${val}</div>`;
          }
          html += `</div>`;
      }
      if (items.length > 50) html += `<div style="color:#888">... ${items.length - 50} de plus</div>`;
      body.innerHTML = html;
      panel.classList.add('visible');
  }
  window.showApiDetail = showApiDetail;

  function showApiErrorReport(url, detail) {
      const panel = document.getElementById('api_detail_panel');
      const header = document.getElementById('api_detail_url');
      const body = document.getElementById('api_detail_body');
      if (!panel || !body) return;
      if (header) header.textContent = '❌ ' + url;

      let html = '';
      html += `<div style="color:#f66;font-weight:bold;margin-bottom:10px;font-size:13px;">Rapport d'erreur API</div>`;

      html += `<div style="color:#e8a840;font-weight:600;margin:8px 0 4px;">📤 Requête</div>`;
      html += `<div style="padding-left:8px;">`;
      html += `<div><span style="color:#6af">Méthode:</span> ${detail.method}</div>`;
      html += `<div><span style="color:#6af">URL:</span> <span style="word-break:break-all;">${detail.url}</span></div>`;
      html += `</div>`;

      html += `<div style="color:#e8a840;font-weight:600;margin:8px 0 4px;">📋 En-têtes de requête</div>`;
      html += `<div style="padding-left:8px;">`;
      if (detail.headers) {
          for (const [k, v] of Object.entries(detail.headers)) {
              html += `<div><span style="color:#6af">${k}:</span> ${v}</div>`;
          }
      }
      html += `</div>`;

      if (detail.body) {
          html += `<div style="color:#e8a840;font-weight:600;margin:8px 0 4px;">📦 Corps de requête</div>`;
          html += `<pre style="padding:6px 8px;background:rgba(255,255,255,0.03);border-radius:4px;white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;">${JSON.stringify(detail.body, null, 2)}</pre>`;
      }

      if (detail.response) {
          const resp = detail.response;
          html += `<div style="color:#f66;font-weight:600;margin:8px 0 4px;">📥 Réponse</div>`;
          html += `<div style="padding-left:8px;">`;
          if (resp.status) html += `<div><span style="color:#6af">Status:</span> <span style="color:#f66">${resp.status} ${resp.statusText || ''}</span></div>`;
          if (resp.error) html += `<div><span style="color:#6af">Erreur:</span> <span style="color:#f66">${resp.error}</span></div>`;
          html += `</div>`;

          if (resp.headers) {
              html += `<div style="color:#e8a840;font-weight:600;margin:8px 0 4px;">📋 En-têtes de réponse</div>`;
              html += `<div style="padding-left:8px;">`;
              for (const [k, v] of Object.entries(resp.headers)) {
                  html += `<div><span style="color:#6af">${k}:</span> ${v}</div>`;
              }
              html += `</div>`;
          }

          if (resp.body) {
              html += `<div style="color:#e8a840;font-weight:600;margin:8px 0 4px;">📦 Corps de réponse</div>`;
              let displayBody = resp.body;
              try { displayBody = JSON.stringify(JSON.parse(resp.body), null, 2); } catch(_) {}
              html += `<pre style="padding:6px 8px;background:rgba(255,60,60,0.06);border:1px solid rgba(255,60,60,0.15);border-radius:4px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;color:#ddd;">${displayBody}</pre>`;
          }
      }

      body.innerHTML = html;
      panel.classList.add('visible');
  }
  window.showApiErrorReport = showApiErrorReport;

  function hideApiMonitorIfClean() {
      const panel = document.getElementById('api_monitor');
      if (!panel) return;
      if (_monitorHasErrors) {
          panel.classList.remove('loading-mode');
          panel.classList.add('visible');
          return;
      }
      panel.classList.add('fade-out-monitor');
      setTimeout(() => {
          panel.classList.remove('visible', 'loading-mode', 'fade-out-monitor');
          panel.style.cssText = '';
      }, 1100);
  }
  initApiMonitor();

  let _debugVisible = false;
  function toggleDebugPanels() {
      _debugVisible = !_debugVisible;
      const btn = document.getElementById('btn_debug');
      const monitor = document.getElementById('api_monitor');
      const geoPanel = document.getElementById('geo_error_panel');
      const roomPanel = document.getElementById('room_assoc_panel');

      if (_debugVisible) {
          if (btn) btn.style.backgroundColor = '#cc5500';
          if (monitor) {
              monitor.classList.add('visible');
              monitor.classList.remove('loading-mode', 'fade-out-monitor');
          }
          if (geoPanel && geoPanel.querySelector('#geo_error_panel_content')?.innerHTML) {
              geoPanel.style.display = 'block';
          }
          if (roomPanel && roomPanel.querySelector('#room_assoc_content')?.innerHTML) {
              roomPanel.style.display = 'block';
          }
          console.log('[Debug] Panels shown');
      } else {
          if (btn) btn.style.backgroundColor = '#555';
          if (monitor) monitor.classList.remove('visible');
          if (geoPanel) geoPanel.style.display = 'none';
          if (roomPanel) roomPanel.style.display = 'none';
          console.log('[Debug] Panels hidden');
      }
  }
  window.toggleDebugPanels = toggleDebugPanels;

  initApp();
</script>

<div id="api_monitor">
    <div id="api_monitor_header">
        <span><i class="fas fa-satellite-dish" style="margin-right:6px;"></i>API Monitor <span id="api_monitor_count" style="color:#888;font-weight:400;margin-left:6px;"></span></span>
        <button onclick="document.getElementById('api_monitor').classList.remove('visible')" title="Fermer">&times;</button>
    </div>
    <div id="api_monitor_body"></div>
</div>

<div id="geo_error_panel">
    <button class="geo-close" onclick="document.getElementById('geo_error_panel').style.display='none'">&times;</button>
    <div id="geo_error_panel_content"></div>
</div>

<div id="room_assoc_panel">
    <button class="ra-close" onclick="document.getElementById('room_assoc_panel').style.display='none'">&times;</button>
    <div id="room_assoc_content"></div>
</div>

<div id="api_detail_panel">
    <div id="api_detail_header">
        <span><i class="fas fa-database" style="margin-right:6px;"></i><span id="api_detail_url"></span></span>
        <button onclick="document.getElementById('api_detail_panel').classList.remove('visible')" title="Fermer">&times;</button>
    </div>
    <div id="api_detail_body"></div>
</div>

</body>
</html>
