<html>
<head>
    <meta charset="UTF-8">
    <title>3dit - Infrastructure Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #editor_container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 0;
            z-index: 900;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        #editor_header {
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            background-color: #252526;
            border-bottom: 1px solid #3e3e42;
        }

        #user_info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaa;
            font-size: 13px;
        }
        #user_info .user-name {
            color: #ccc;
            font-weight: 500;
        }
        #user_info .logout-btn {
            background: none;
            border: 1px solid #555;
            color: #aaa;
            padding: 3px 8px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 11px;
        }
        #user_info .logout-btn:hover {
            color: #fff;
            border-color: #888;
        }

        .editor-tabs {
            display: flex;
            background-color: #252526;
            padding-left: 20px;
            border-bottom: 1px solid #3e3e42;
        }

        .tab-btn {
            background-color: transparent;
            border: none;
            color: #969696;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 13px;
            border-right: 1px solid #3e3e42;
        }

        .tab-btn:hover {
            color: white;
            background-color: #2d2d2d;
        }

        .tab-btn.active {
            color: white;
            background-color: #1e1e1e;
            border-top: 2px solid #007acc;
        }

        .tab-content {
            flex-grow: 1;
            display: none;
            position: relative;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        #json_editor {
            width: 100%;
            height: 100%;
            background-color: #1e1e1e;
            color: #dcdcdc;
            border: none;
            padding: 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            box-sizing: border-box;
        }

        #builder_layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #builder_canvas {
            flex-grow: 1;
            background-color: #000;
            position: relative;
            min-height: 200px;
            overflow: hidden;
        }
        #scene_fade_overlay {
            position: absolute; inset: 0;
            background: #000;
            opacity: 0; pointer-events: none;
            z-index: 5;
            transition: opacity 0.5s ease;
        }
        #scene_fade_overlay.active { opacity: 1; }
        #scene_fade_overlay.fast { transition-duration: 0.3s; }
        #builder_canvas > div:not(#breadcrumb):not(#scene_fade_overlay):not(#_rack_view_btns) {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: auto;
        }
        #builder_canvas canvas {
            display: block;
            width: 100%;
            height: 100%;
            pointer-events: auto;
        }

        #builder_palette {
            width: 400px;
            background-color: #252526;
            border-left: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #builder_navigator {
            width: 300px;
            background-color: #252526;
            border-left: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #navigator_content {
            padding: 10px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .navigator-item {
            padding: 8px;
            margin: 2px 0;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            transition: background 0.2s;
        }

        .navigator-item:hover {
            background-color: #2d2d2d;
        }

        .navigator-item.selected {
            background-color: #0e639c;
            color: white;
        }

        .navigator-item.has-children {
            position: relative;
        }

        .navigator-children {
            margin-left: 20px;
            border-left: 1px solid #3e3e42;
            padding-left: 10px;
        }

        .navigator-toggle {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 10px;
        }

        .navigator-delete-btn, .navigator-clone-btn {
            margin-left: 5px;
            padding: 2px 6px;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .navigator-delete-btn {
            background-color: #c72525;
        }

        .navigator-delete-btn:hover {
            background-color: #e63939;
        }

        .navigator-clone-btn {
            background-color: #0e639c;
        }

        .navigator-clone-btn:hover {
            background-color: #1177bb;
        }

        .navigator-item:hover .navigator-delete-btn,
        .navigator-item:hover .navigator-clone-btn {
            opacity: 1;
        }

        #palette_library {
            padding: 10px;
            overflow-y: auto;
            flex: 0 0 auto;
            max-height: 40%;
        }

        #palette_tree {
            border-top: 1px solid #3e3e42;
            overflow-y: auto;
            flex: 1 1 50%;
            min-height: 100px;
            padding: 8px;
            font-size: 12px;
        }
        #palette_tree .tree-node {
            padding: 2px 0 2px 14px;
            cursor: pointer;
            white-space: nowrap;
            border-radius: 3px;
            color: #bbb;
        }
        #palette_tree .tree-node:hover {
            background: #333;
            color: #fff;
        }
        #palette_tree .tree-node.selected {
            background: #264f78;
            color: #fff;
        }
        #palette_tree .tree-node i {
            width: 16px;
            text-align: center;
            margin-right: 4px;
            font-size: 11px;
        }
        #palette_tree .tree-children {
            padding-left: 10px;
            border-left: 1px solid #3a3a3a;
            margin-left: 6px;
        }
        #palette_tree .tree-toggle {
            display: inline-block;
            width: 12px;
            cursor: pointer;
            color: #888;
            font-size: 10px;
            user-select: none;
        }
        #palette_tree .tree-section {
            color: #e8a840;
            font-weight: bold;
            font-size: 12px;
            margin: 6px 0 3px 0;
            padding: 2px 0;
        }

        #palette_inspector {
            padding: 10px;
            background-color: #1e1e1e;
            border-top: 1px solid #3e3e42;
            overflow-y: auto;
            flex: 1 1 auto;
            display: none;
        }

        #breadcrumb {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            height: 20px;
            background: rgba(30,30,30,0.7);
            padding: 0 10px;
            font-size: 11px;
            color: #bbb;
            pointer-events: auto;
            display: none;
            align-items: center;
            gap: 2px;
            backdrop-filter: blur(6px);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        #breadcrumb .bc-item {
            cursor: pointer;
            color: #6db3f2;
            padding: 1px 3px;
            border-radius: 2px;
        }
        #breadcrumb .bc-item:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        #breadcrumb .bc-sep {
            color: #555;
            margin: 0 2px;
        }
        #breadcrumb .bc-current {
            color: #fff;
            font-weight: 600;
        }

        .inspector-field {
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .inspector-label {
            display: block;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 0;
            margin-right: 10px;
            flex-shrink: 0;
            width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .inspector-input {
            width: 100%;
            background-color: #333;
            border: 1px solid #444;
            color: white;
            padding: 4px;
            font-size: 12px;
            box-sizing: border-box;
            flex-grow: 1;
        }

        .palette-item {
            background-color: #333;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .palette-item:hover {
            background-color: #444;
        }

        .action-btn {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 2px;
        }

        .action-btn:hover {
            background-color: #1177bb;
        }

        .view-toggle-btn {
            background-color: #3c3c3c;
            color: #aaa;
            border: none;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .view-toggle-btn:hover {
            background-color: #505050;
            color: #fff;
        }
        .view-toggle-btn.active {
            background-color: #0e639c;
            color: white;
        }

        .badge-live {
            display: inline-block;
            background: #d32f2f;
            color: #fff;
            font-size: 9px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            margin-left: 6px;
            vertical-align: middle;
            letter-spacing: 0.5px;
            animation: pulse-live 2s infinite;
        }
        @keyframes pulse-live {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #file_selector optgroup {
            font-style: normal;
            font-weight: 600;
            color: #aaa;
            background: #2d2d2d;
        }
        #file_selector option {
            font-weight: 400;
            color: #ddd;
            background: #3c3c3c;
            padding: 4px 8px;
        }

        .inventory-banner {
            display: none;
            background: linear-gradient(90deg, #1a3a5c, #0e639c22);
            border: 1px solid #0e639c55;
            border-radius: 4px;
            padding: 8px 12px;
            margin-bottom: 8px;
            font-size: 11px;
            color: #8cc4ff;
            align-items: center;
            gap: 8px;
        }
        .inventory-banner i { color: #4da6ff; }
        .inventory-banner .btn-fork {
            background: #0e639c;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            white-space: nowrap;
        }
        .inventory-banner .btn-fork:hover { background: #1177bb; }

        #palette_inspector.readonly .inspector-input {
            background: #2a2a2a;
            border-color: #333;
            color: #888;
            pointer-events: none;
        }
        #palette_inspector.readonly .inspector-input:focus {
            outline: none;
        }

        #api_monitor {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 440px;
            max-height: 320px;
            background: rgba(20,20,24,0.92);
            backdrop-filter: blur(8px);
            border: 1px solid #444;
            border-radius: 6px;
            z-index: 9000;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 11px;
            color: #ccc;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #api_monitor.visible { display: flex; }
        #api_monitor_header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid #333;
            font-size: 11px;
            font-weight: 600;
            color: #8cc4ff;
            flex-shrink: 0;
        }
        #api_monitor_header button {
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
        }
        #api_monitor_header button:hover { color: #fff; }
        #api_monitor_body {
            overflow-y: auto;
            flex: 1;
            padding: 4px 0;
        }
        .api-row {
            display: flex;
            align-items: center;
            padding: 3px 10px;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .api-row:last-child { border-bottom: none; }
        .api-row .api-icon {
            width: 14px;
            text-align: center;
            flex-shrink: 0;
        }
        .api-row .api-url {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #aaa;
        }
        .api-row .api-status {
            flex-shrink: 0;
            font-weight: 600;
            min-width: 32px;
            text-align: right;
        }
        .api-row .api-dur {
            flex-shrink: 0;
            color: #666;
            min-width: 50px;
            text-align: right;
        }
        .api-row.pending .api-icon { color: #e8a840; }
        .api-row.pending .api-status { color: #e8a840; }
        .api-row.ok .api-icon { color: #4ec46a; }
        .api-row.ok .api-status { color: #4ec46a; }
        .api-row.fail .api-icon { color: #e85050; }
        .api-row.fail .api-status { color: #e85050; }
        .api-row .api-count {
            flex-shrink: 0;
            color: #6af;
            min-width: 38px;
            text-align: right;
            font-size: 11px;
        }
        .api-row .api-view-btn {
            flex-shrink: 0;
            background: rgba(0,140,255,0.15);
            border: 1px solid rgba(0,140,255,0.3);
            color: #6af;
            cursor: pointer;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 3px;
        }
        .api-row .api-view-btn:hover { background: rgba(0,140,255,0.3); color: #fff; }
        #api_detail_panel {
            display: none;
            position: fixed;
            top: 60px; right: 10px; bottom: 60px;
            width: 560px;
            background: rgba(10,14,26,0.97);
            border: 1px solid rgba(0,170,255,0.15);
            border-radius: 8px;
            z-index: 20002;
            flex-direction: column;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 11px;
            color: #ccc;
            box-shadow: 0 8px 40px rgba(0,0,0,0.7);
        }
        #api_detail_panel.visible { display: flex; }
        #api_detail_header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            font-weight: 600;
            color: #6af;
        }
        #api_detail_header button {
            background: none; border: none; color: #888; cursor: pointer; font-size: 16px; padding: 0 4px;
        }
        #api_detail_header button:hover { color: #fff; }
        #api_detail_body {
            flex: 1;
            overflow: auto;
            padding: 8px 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* ── Loading Screen ── */
        #loading_screen {
            position: fixed; inset: 0;
            background: #0a0e1a;
            z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        #loading_screen.fade-out {
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        .loading-bg-grid {
            position: absolute; inset: 0;
            background:
                linear-gradient(rgba(0,200,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,200,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridScroll 20s linear infinite;
        }
        @keyframes gridScroll {
            to { background-position: 40px 40px; }
        }
        .loading-glow {
            position: absolute;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,180,255,0.06) 0%, transparent 70%);
            animation: glowPulse 3s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        .loading-content {
            position: relative; z-index: 2;
            text-align: center; max-width: 520px; width: 90%;
        }
        .loading-svg-wrap {
            margin: 0 auto 20px; width: 220px; height: 160px;
        }
        #dc_build_svg .dc-line {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: dcDraw 2.5s ease forwards;
        }
        #dc_build_svg .dc-line.d1 { animation-delay: 0s; }
        #dc_build_svg .dc-line.d2 { animation-delay: 0.15s; }
        #dc_build_svg .dc-line.d3 { animation-delay: 0.3s; }
        #dc_build_svg .dc-line.d4 { animation-delay: 0.45s; }
        #dc_build_svg .dc-line.d5 { animation-delay: 0.6s; }
        #dc_build_svg .dc-line.d6 { animation-delay: 0.75s; }
        #dc_build_svg .dc-line.d7 { animation-delay: 0.9s; }
        #dc_build_svg .dc-line.d8 { animation-delay: 1.05s; }
        #dc_build_svg .dc-line.d9 { animation-delay: 1.2s; }
        #dc_build_svg .dc-line.d10 { animation-delay: 1.35s; }
        #dc_build_svg .dc-line.d11 { animation-delay: 1.5s; }
        #dc_build_svg .dc-line.d12 { animation-delay: 1.65s; }
        #dc_build_svg .dc-line.d13 { animation-delay: 1.8s; }
        #dc_build_svg .dc-line.d14 { animation-delay: 1.95s; }
        #dc_build_svg .dc-line.d15 { animation-delay: 2.1s; }
        #dc_build_svg .dc-fill {
            opacity: 0;
            animation: dcFadeIn 1s ease forwards;
        }
        #dc_build_svg .dc-fill.f1 { animation-delay: 2.2s; }
        #dc_build_svg .dc-fill.f2 { animation-delay: 2.4s; }
        #dc_build_svg .dc-fill.f3 { animation-delay: 2.6s; }
        #dc_build_svg .dc-fill.f4 { animation-delay: 2.8s; }
        #dc_build_svg .dc-blink {
            animation: dcBlink 1.5s ease-in-out infinite;
        }
        #dc_build_svg .dc-blink.b1 { animation-delay: 2.6s; }
        #dc_build_svg .dc-blink.b2 { animation-delay: 2.8s; }
        #dc_build_svg .dc-blink.b3 { animation-delay: 3.0s; }
        #dc_build_svg .dc-blink.b4 { animation-delay: 3.2s; }
        @keyframes dcDraw {
            to { stroke-dashoffset: 0; }
        }
        @keyframes dcFadeIn {
            to { opacity: 1; }
        }
        @keyframes dcBlink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        #api_monitor.loading-mode {
            position: fixed;
            bottom: 20px; left: 20px; right: auto;
            width: 400px; max-height: 260px;
            z-index: 10001;
            border-color: rgba(0,200,255,0.15);
            background: rgba(10,14,26,0.95);
        }
        #api_monitor.loading-mode .api-row { font-size: 10px; padding: 2px 8px; }
        #api_monitor.loading-mode.fade-out-monitor {
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        .loading-logo {
            font-size: 48px; font-weight: 800;
            color: #fff; letter-spacing: 4px;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(0,180,255,0.5);
        }
        .loading-logo span { color: #00ccff; }
        .loading-subtitle {
            color: #446; font-size: 13px;
            margin-bottom: 40px; letter-spacing: 2px;
            text-transform: uppercase;
        }
        .loading-progress-track {
            width: 100%; height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px; margin-bottom: 32px;
            overflow: hidden;
        }
        .loading-progress-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #00ccff, #00ff88);
            border-radius: 2px;
            transition: width 0.4s ease;
            box-shadow: 0 0 12px rgba(0,204,255,0.5);
        }
        .loading-steps {
            display: flex; flex-direction: column;
            gap: 10px; text-align: left;
        }
        .loading-step {
            display: flex; align-items: center; gap: 10px;
            font-size: 12px; color: #556677;
            transition: color 0.3s;
        }
        .loading-step.active { color: #8cc4ff; }
        .loading-step.done { color: #4ec46a; }
        .loading-step.error { color: #e85050; }
        .loading-step-icon {
            width: 18px; height: 18px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .loading-step-icon .dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: #445566;
        }
        .loading-step.active .dot {
            background: #00ccff;
            box-shadow: 0 0 8px rgba(0,204,255,0.6);
            animation: dotPulse 1s ease-in-out infinite;
        }
        .loading-step.done .dot { background: #4ec46a; }
        .loading-step.error .dot { background: #e85050; }
        @keyframes dotPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.5); }
        }
        .loading-step-text { flex: 1; }
        .loading-step-count {
            color: #667788; font-size: 11px; font-family: monospace;
            min-width: 60px; text-align: right;
        }
        .loading-step.active .loading-step-count { color: #8cc4ff; }
        .loading-step.done .loading-step-count { color: #4ec46a; }
        .loading-status {
            margin-top: 24px; color: #8899bb;
            font-size: 11px; letter-spacing: 1px;
        }
        .loading-status.auth { color: #4ec46a; }
        .loading-geo-report {
            margin-top: 16px; text-align: left; width: 100%;
            max-height: 220px; overflow-y: auto;

<script type="module">
  import * as THREE from "three";
  window.THREE = THREE;
  import * as ThreeMeshUI from "three-mesh-ui";
  import Keycloak from 'keycloak-js';
  import { Builder } from './builder.js';
  import { ApiClient } from './api-client.js';

  const api = new ApiClient();
  window.api = api;

  // --- Loading screen helpers ---
  const _loadingSteps = {};
  function loadingSetStatus(text, cls = '') {
      const el = document.getElementById('loading_status');
      if (el) { el.textContent = text; el.className = 'loading-status' + (cls ? ' ' + cls : ''); }
  }
  function loadingSetProgress(pct) {
      const bar = document.getElementById('loading_bar');
      if (bar) bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
  }
  function loadingAddStep(id, label) {
      const container = document.getElementById('loading_steps');
      if (!container) return;
      const step = document.createElement('div');
      step.className = 'loading-step';
      step.id = 'lstep_' + id;
      step.innerHTML = `<div class="loading-step-icon"><div class="dot"></div></div>`
          + `<div class="loading-step-text">${label}</div>`
          + `<div class="loading-step-count" id="lstep_count_${id}"></div>`;
      container.appendChild(step);
      _loadingSteps[id] = step;
  }
  function loadingStepActive(id) {
      const s = _loadingSteps[id]; if (s) s.className = 'loading-step active';
  }
  function loadingStepDone(id, count) {
      const s = _loadingSteps[id]; if (s) s.className = 'loading-step done';
      const c = document.getElementById('lstep_count_' + id);
      if (c && count !== undefined) c.textContent = count + ' items';
  }
  function loadingStepError(id, msg) {
      const s = _loadingSteps[id]; if (s) s.className = 'loading-step error';
      const c = document.getElementById('lstep_count_' + id);
      if (c) c.textContent = msg || 'erreur';
  }
  function loadingStepCount(id, count) {
      const c = document.getElementById('lstep_count_' + id);
      if (c) c.textContent = count + '...';
  }
  function loadingHide() {
      const screen = document.getElementById('loading_screen');
      if (screen) {
          screen.classList.add('fade-out');
          setTimeout(() => screen.remove(), 900);
      }
  }

  // --- Keycloak Auth ---
  async function initKeycloak() {
      function showStatus(msg) {
          loadingSetStatus(msg);
      }
      function showError(msg) {
          const screen = document.getElementById('loading_screen');
          if (!screen) return;
          const errDiv = document.getElementById('loading_error') || document.createElement('div');
          errDiv.id = 'loading_error';
          errDiv.style.cssText = 'margin-top:20px;text-align:center;max-width:500px;';
          errDiv.innerHTML = msg;
          const content = screen.querySelector('.loading-content');
          if (content && !document.getElementById('loading_error')) content.appendChild(errDiv);
      }

      showStatus('Chargement de la configuration Keycloak...');
      console.log('[Auth] Loading keycloak config...');
      const kcConfigResp = await fetch('/config/keycloak.json');
      const kcConfig = await kcConfigResp.json();
      console.log('[Auth] Keycloak config loaded:', { url: kcConfig.url, realm: kcConfig.realm, clientId: kcConfig.clientId });

      showStatus('Initialisation de l\'authentification...');
      const keycloak = new Keycloak(kcConfig);
      window._keycloak = keycloak;

      keycloak.onAuthError = (err) => {
          console.error('[Auth] Keycloak auth error:', err);
      };
      keycloak.onAuthRefreshError = () => {
          console.error('[Auth] Token refresh failed, re-login required');
      };

      try {
          console.log('[Auth] Calling keycloak.init({ onLoad: "login-required", pkceMethod: "S256" })...');
          const authenticated = await keycloak.init({
              onLoad: 'login-required',
              checkLoginIframe: false,
              pkceMethod: 'S256'
          });

          if (!authenticated) {
              console.log('[Auth] Not authenticated, redirecting to login...');
              keycloak.login();
              return false;
          }

          console.log('[Auth] Authenticated successfully');
          console.log('[Auth] Token present:', !!keycloak.token);
          console.log('[Auth] Token length:', keycloak.token ? keycloak.token.length : 0);
          console.log('[Auth] Token (first 50 chars):', keycloak.token ? keycloak.token.substring(0, 50) + '...' : 'null');
          console.log('[Auth] Token parsed:', keycloak.tokenParsed ? {
              sub: keycloak.tokenParsed.sub,
              preferred_username: keycloak.tokenParsed.preferred_username,
              email: keycloak.tokenParsed.email,
              exp: keycloak.tokenParsed.exp,
              iss: keycloak.tokenParsed.iss,
              aud: keycloak.tokenParsed.aud,
              azp: keycloak.tokenParsed.azp,
              scope: keycloak.tokenParsed.scope
          } : 'null');

          api.setToken(keycloak.token);
          console.log('[Auth] Token set on ApiClient');

          setInterval(() => {
              keycloak.updateToken(30).then(refreshed => {
                  if (refreshed) {
                      api.setToken(keycloak.token);
                      console.log('[Auth] Token refreshed');
                  }
              }).catch(() => keycloak.login());
          }, 30000);

          const nameEl = document.getElementById('user_name');
          if (nameEl && keycloak.tokenParsed) {
              nameEl.textContent = keycloak.tokenParsed.preferred_username
                  || keycloak.tokenParsed.name
                  || keycloak.tokenParsed.email
                  || 'Utilisateur';
          }
          window.keycloakLogout = () => keycloak.logout();
          return true;

      } catch (err) {
          console.error('[Auth] Keycloak init FAILED:', err);
          console.error('[Auth] Error name:', err.name);
          console.error('[Auth] Error message:', err.message);
          console.error('[Auth] Error stack:', err.stack);

          showError(`
              <div style="color:#e85050;font-size:14px;margin-bottom:10px;">
                  <i class="fas fa-exclamation-triangle"></i> Erreur d'authentification
              </div>
              <div style="color:#ccc;font-size:12px;margin-bottom:10px;">${err.message || err}</div>
              <div style="color:#888;font-size:11px;margin-bottom:14px;">
                  Keycloak: ${kcConfig.url}<br>
                  Realm: ${kcConfig.realm}<br>
                  Client: ${kcConfig.clientId}
              </div>
              <button onclick="location.reload()" style="padding:6px 16px;background:#4a90d9;color:#fff;border:none;border-radius:4px;cursor:pointer;">Réessayer</button>
              <button onclick="document.getElementById('loading_screen')?.remove();document.getElementById('editor_container').style.display='flex';" 
                  style="padding:6px 16px;background:#444;color:#ccc;border:1px solid #555;border-radius:4px;cursor:pointer;margin-left:8px;">Continuer sans auth</button>
          `);
          return false;
      }
  }

  const authOk = await initKeycloak();
  if (!authOk) {
      console.warn('[Auth] App stopped - authentication required');
      throw new Error('Auth required');
  }

  loadingSetStatus('Authentification réussie', 'auth');
  loadingSetProgress(10);
  document.getElementById('editor_container').style.display = 'flex';

  window.builder = new Builder('builder_canvas', 'json_editor');

  window._currentConfigId = null;
  window._isInventoryMode = false;
  window._inventoryJSON = null;

  // --- Build inventory project from API ---
  async function buildInventoryProject(withLoadingUI = false) {
      console.log('[Inventory] Building inventory project from API...');
      if (!api._token) {
          console.error('[Inventory] WARNING: No auth token - API calls will fail.');
      }

      const steps = [
          { id: 'dc', label: 'Datacenters', fn: (p) => api.listDatacenters(p) },
          { id: 'loc', label: 'Locations (salles)', fn: (p) => api.listLocations(p) },
          { id: 'racks', label: 'Racks', fn: (p) => api.listRacks(p) },
          { id: 'devices', label: 'Devices', fn: (p) => api.listDevices(p) },
          { id: 'dtypes', label: 'Types de devices', fn: (p) => api.listDeviceTypes(p) },
          { id: 'hosts', label: 'Machines virtuelles', fn: (p) => api.listHosts(p) },
      ];

      if (withLoadingUI) {
          for (const s of steps) loadingAddStep(s.id, s.label);
          loadingAddStep('geo', 'Géocodage des adresses');
          loadingAddStep('build', 'Construction du modèle 3D');
      }

      const data = {};
      const totalSteps = steps.length + 2;
      for (let i = 0; i < steps.length; i++) {
          const s = steps[i];
          if (withLoadingUI) {
              loadingStepActive(s.id);
              loadingSetStatus(`Chargement ${s.label}...`);
          }
          try {
              data[s.id] = await s.fn((count) => {
                  if (withLoadingUI) loadingStepCount(s.id, count);
              });
              const count = Array.isArray(data[s.id]) ? data[s.id].length : 0;
              console.log(`[Inventory] ${s.label}: ${count} elements`);
              if (withLoadingUI) loadingStepDone(s.id, count);
          } catch (e) {
              console.warn(`[Inventory] ${s.label}: FAILED -`, e.message);
              data[s.id] = [];
              if (withLoadingUI) loadingStepError(s.id, e.message?.substring(0, 30));
          }
          if (withLoadingUI) loadingSetProgress(10 + ((i + 1) / totalSteps) * 80);
      }

      const dcList = data.dc || [];
      const locationList = data.loc || [];
      const rackList = data.racks || [];
      const deviceList = data.devices || [];
      const dtList = data.dtypes || [];
      const hostList = data.hosts || [];

      function _id(obj) { return obj.Id ?? obj.id ?? obj.ID; }

      const locationsByDC = {};
      const _roomAssocReport = [];
      const _dcIdSet = new Set(dcList.map(dc => String(_id(dc))));

      locationList.forEach(loc => {
          const locName = loc.Titre || loc.Name || loc.Nom || '(sans nom)';
          const sitesId = loc.SitesId ?? null;
          const datacentersId = loc.DatacentersId ?? null;
          const datacenterId = loc.DatacenterId ?? null;
          const resolvedId = sitesId || datacentersId || datacenterId || '_none';
          const matchesDC = _dcIdSet.has(String(resolvedId));

          _roomAssocReport.push({
              locId: _id(loc),
              locName,
              SitesId: sitesId,
              DatacentersId: datacentersId,
              DatacenterId: datacenterId,
              resolvedDcId: resolvedId,
              matched: matchesDC,
              allKeys: Object.keys(loc).filter(k => k.toLowerCase().includes('id') || k.toLowerCase().includes('site') || k.toLowerCase().includes('datacenter'))
                  .map(k => `${k}=${loc[k]}`).join(', ')
          });

          if (!locationsByDC[resolvedId]) locationsByDC[resolvedId] = [];
          locationsByDC[resolvedId].push(loc);
      });
      console.log('[Inventory] Locations grouped by DC:', Object.entries(locationsByDC).map(([k, v]) => `${k}: ${v.length}`).join(', '));
      console.log('[Room Assoc Report]', _roomAssocReport);

      const dtMap = {};
      dtList.forEach(dt => { dtMap[_id(dt)] = dt; });

      function isSwitch(device) {
          const dt = dtMap[device.DevicesTypesId];
          if (!dt) return false;
          const t = ((dt.Titre || '') + ' ' + (dt.Manufacturer || '')).toLowerCase();
          return t.includes('switch') || t.includes('cisco') || t.includes('palo') || t.includes('firewall') || t.includes('fortinet');
      }

      function deviceSizeU(device) {
          const dt = dtMap[device.DevicesTypesId];
          return dt && dt.Height ? parseInt(dt.Height) || 1 : 1;
      }

      function deviceTypeImages(device) {
          const dt = dtMap[device.DevicesTypesId];
          if (!dt) return {};
          const result = {};
          if (dt.FrontImage) result.frontImage = dt.FrontImage;
          if (dt.RearImage) result.rearImage = dt.RearImage;
          const ports = parseInt(dt.NetworkPorts) || 0;
          if (ports > 0) result.networkPorts = ports;
          return result;
      }

      function deviceTypeName(device) {
          const dt = dtMap[device.DevicesTypesId];
          if (!dt) return 'generic-1u';
          const m = (dt.Manufacturer || '').toLowerCase();
          const t = (dt.Titre || '').toLowerCase();
          if (m.includes('dell')) return 'dell-poweredge-' + (deviceSizeU(device)) + 'u';
          if (m.includes('hpe') || m.includes('hp')) return 'hpe-apollo-' + (deviceSizeU(device)) + 'u';
          if (t.includes('switch') || m.includes('cisco')) return 'cisco-copper-48';
          if (t.includes('palo') || t.includes('firewall') || m.includes('fortinet')) return 'palo-alto-1u';
          return 'generic-' + (deviceSizeU(device)) + 'u';
      }

      // Map location -> datacenter, and build location map
      const locationToDC = {};
      const locationMap = {};
      locationList.forEach(loc => {
          const dcId = loc.SitesId || loc.DatacentersId || loc.DatacenterId;
          if (dcId) locationToDC[_id(loc)] = dcId;
          locationMap[_id(loc)] = loc;
      });

      // Group racks by datacenter via Location -> DC chain
      const racksByDC = {};
      // Also group racks by location (room)
      const racksByLocation = {};
      rackList.forEach(r => {
          const locId = r.LocationsId;
          const dcId = locationToDC[locId] || r.DatacentersId || r.DatacenterId || '_none';
          if (!racksByDC[dcId]) racksByDC[dcId] = [];
          racksByDC[dcId].push(r);
          const locKey = locId || '_no_room';
          if (!racksByLocation[locKey]) racksByLocation[locKey] = [];
          racksByLocation[locKey].push(r);
      });
      console.log('[Inventory] Racks grouped by DC:', Object.entries(racksByDC).map(([k, v]) => `${k}: ${v.length}`).join(', '));

      const devicesByRack = {};
      deviceList.forEach(d => {
          const rid = d.RacksId || d.RackId || '_none';
          if (!devicesByRack[rid]) devicesByRack[rid] = [];
          devicesByRack[rid].push(d);
      });

      function buildRackObj(r) {
          const devs = devicesByRack[_id(r)] || [];
          return {
              name: r.Titre || r.Name || ('Rack ' + _id(r)),
              class: 'rack',
              units: parseInt(r.Height) || 42,
              _apiId: _id(r),
              equipment: devs.map(d => ({
                  name: d.Name || 'Device',
                  class: isSwitch(d) ? 'physicalswitch' : 'physicalserver',
                  type: deviceTypeName(d),
                  startU: parseInt(d.Position) || 1,
                  sizeU: deviceSizeU(d),
                  _apiId: _id(d),
                  ...deviceTypeImages(d)
              }))
          };
      }

      function parseRackName(rack) {
          const name = rack.Titre || rack.Name || '';
          const match = name.match(/^([A-Za-z])(\d+)/);
          if (match) return { letter: match[1].toUpperCase(), num: parseInt(match[2]) };
          return { letter: '_', num: 1 };
      }

      function groupRacksByRow(racks) {
          if (racks.length === 0) return [];

          let maxLetter = 'A';
          let maxNum = 1;
          const rackMap = {};

          racks.forEach(r => {
              const { letter, num } = parseRackName(r);
              if (letter > maxLetter && letter !== '_') maxLetter = letter;
              if (num > maxNum) maxNum = num;
              const key = letter + num;
              rackMap[key] = r;
          });

          const rowCount = maxLetter.charCodeAt(0) - 'A'.charCodeAt(0) + 1;
          const rows = [];

          for (let ri = 0; ri < rowCount; ri++) {
              const letter = String.fromCharCode('A'.charCodeAt(0) + ri);
              const rowRacks = [];

              for (let ni = 1; ni <= maxNum; ni++) {
                  const key = letter + ni;
                  const real = rackMap[key];
                  if (real) {
                      rowRacks.push(buildRackObj(real));
                  } else {
                      rowRacks.push({
                          name: key,
                          class: 'rack',
                          units: 42,
                          ghost: true,
                          equipment: []
                      });
                  }
              }

              rows.push({
                  name: 'Rangée ' + letter,
                  class: 'row',
                  rowIndex: ri,
                  racks: rowRacks
              });
          }

          return rows;
      }

      function cleanAddress(raw) {
          if (!raw) return '';
          let a = raw.trim();
          a = a.replace(/(\d{5})\s*([A-ZÀ-Ü][a-zà-ü])/g, '$1 $2');
          a = a.replace(/([a-zà-ü])([A-ZÀ-Ü])/g, '$1, $2');

          const parts = a.split(/,\s*/);
          const seen = new Set();
          const deduped = [];
          for (const p of parts) {
              const key = p.trim().toLowerCase();
              if (key && !seen.has(key)) {
                  seen.add(key);
                  deduped.push(p.trim());
              }
          }
          a = deduped.join(', ');
          a = a.replace(/\s+/g, ' ').trim();
          return a;
      }

      function extractPostalCity(address) {
          const match = address.match(/(\d{4,5})\s+([A-ZÀ-Üa-zà-ü\s-]+)/);
          if (match) return `${match[1]} ${match[2].trim()}`;
          const cityMatch = address.match(/,\s*([A-ZÀ-Ü][a-zà-ü]+(?:\s[A-ZÀ-Ü][a-zà-ü]+)*)$/);
          if (cityMatch) return cityMatch[1];
          return null;
      }

      async function geocodeNominatim(query) {
          try {
              const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
              const resp = await fetch(url);
              if (!resp.ok) return null;
              const data = await resp.json();
              if (data.length > 0) {
                  return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
              }
          } catch (e) {
              console.warn(`[Geocode/Nominatim] Error for "${query}":`, e.message);
          }
          return null;
      }

      async function geocodePhoton(query) {
          try {
              const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=1`;
              const resp = await fetch(url);
              if (!resp.ok) return null;
              const data = await resp.json();
              if (data.features && data.features.length > 0) {
                  const coords = data.features[0].geometry.coordinates;
                  return { lat: coords[1], lng: coords[0] };
              }
          } catch (e) {
              console.warn(`[Geocode/Photon] Error for "${query}":`, e.message);
          }
          return null;
      }

      async function geocodeAddress(rawAddress) {
          if (!rawAddress) return null;
          const cleaned = cleanAddress(rawAddress);
          console.log(`[Geocode] Trying cleaned: "${cleaned}"`);

          let result = await geocodeNominatim(cleaned);
          if (result) { console.log(`[Geocode] Nominatim OK: "${cleaned}" -> ${result.lat}, ${result.lng}`); return result; }

          result = await geocodePhoton(cleaned);
          if (result) { console.log(`[Geocode] Photon OK: "${cleaned}" -> ${result.lat}, ${result.lng}`); return result; }

          const postalCity = extractPostalCity(cleaned);
          if (postalCity && postalCity !== cleaned) {
              console.log(`[Geocode] Fallback postal+city: "${postalCity}"`);
              result = await geocodeNominatim(postalCity);
              if (result) { console.log(`[Geocode] Nominatim postal OK: "${postalCity}" -> ${result.lat}, ${result.lng}`); return result; }

              result = await geocodePhoton(postalCity);
              if (result) { console.log(`[Geocode] Photon postal OK: "${postalCity}" -> ${result.lat}, ${result.lng}`); return result; }
          }

          console.warn(`[Geocode] All methods failed for "${rawAddress}"`);
          return null;
      }

      async function buildPhysicalDatacenters() {
          if (withLoadingUI) {
              loadingStepActive('geo');
              loadingSetStatus('Géocodage des adresses...');
          }
          const dcConfigs = [];
          const geoReport = [];
          let geoCount = 0;
          for (const dc of dcList) {
              const dcRacks = racksByDC[_id(dc)] || [];
              const dcLocations = locationsByDC[_id(dc)] || [];

              const rawLat = dc.Latitude ?? dc.latitude ?? null;
              const rawLng = dc.Longitude ?? dc.longitude ?? null;
              let lat = (rawLat !== null && rawLat !== '' && !isNaN(parseFloat(rawLat))) ? parseFloat(rawLat) : null;
              let lng = (rawLng !== null && rawLng !== '' && !isNaN(parseFloat(rawLng))) ? parseFloat(rawLng) : null;
              const address = dc.PhysicalAddress || dc.Address || dc.Adresse || '';
              const dcName = dc.Name || dc.Titre || ('DC ' + _id(dc));
              let geoSource = 'api';
              let needsPatch = false;

              if (lat != null && lng != null && lat !== 0 && lng !== 0) {
                  geoSource = 'api';
              } else {
                  const geo = await geocodeAddress(address);
                  if (geo) {
                      lat = geo.lat;
                      lng = geo.lng;
                      geoSource = 'geocode';
                      needsPatch = true;
                  } else {
                      geoSource = 'failed';
                  }
              }

              if (needsPatch && _id(dc)) {
                  try {
                      await api.patchDatacenter(_id(dc), { Latitude: String(lat), Longitude: String(lng) });
                      console.log(`[Geocode] PATCH OK for "${dcName}": ${lat}, ${lng}`);
                      geoSource = 'geocode+saved';
                  } catch (e) {
                      console.warn(`[Geocode] PATCH failed for "${dcName}":`, e.message);
                      geoSource = 'geocode (save failed)';
                  }
              }

              geoReport.push({ name: dcName, address, lat, lng, source: geoSource, dcId: _id(dc) });
              console.log(`[Geocode DC] "${dcName}" addr="${address}" apiLat=${rawLat} apiLng=${rawLng} -> lat=${lat} lng=${lng} (${geoSource})`, dc);
              geoCount++;
              if (withLoadingUI) loadingStepCount('geo', `${geoCount}/${dcList.length}`);

              const roomConfigs = [];
              for (const loc of dcLocations) {
                  const roomRacks = racksByLocation[_id(loc)] || [];
                  const rows = groupRacksByRow(roomRacks);
                  roomConfigs.push({
                      name: loc.Titre || loc.Name || loc.Nom || 'Salle',
                      class: 'room',
                      _apiId: _id(loc),
                      description: loc.Description || loc.Commentaire || '',
                      rows: rows,
                  });
              }

              console.log(`[Inventory] DC "${dc.Name || dc.Titre}" -> lat:${lat}, lng:${lng}, racks:${dcRacks.length}, rooms:${roomConfigs.length}`);

              dcConfigs.push({
                  name: dc.Name || dc.Titre || ('DC ' + _id(dc)),
                  class: 'datacenter',
                  _apiId: _id(dc),
                  lat: lat,
                  lng: lng,
                  address: address,
                  description: dc.Description || dc.Commentaire || '',
                  rooms: roomConfigs,
                  cables: []
              });
          }
          if (withLoadingUI) {
              loadingStepDone('geo', geoCount);
              const reportEl = document.getElementById('loading_geo_report');
              if (reportEl) {
                  let html = '<div class="geo-title">📍 Rapport de géocodage</div>';
                  for (const g of geoReport) {
                      const ok = g.lat != null && g.lng != null;
                      const coordsClass = ok ? '' : 'error';
                      let sourceIcon = '';
                      if (g.source === 'api') sourceIcon = '📦';
                      else if (g.source.includes('saved')) sourceIcon = '💾';
                      else if (g.source.startsWith('geocode')) sourceIcon = '🌍';
                      else sourceIcon = '❌';
                      const coordsText = ok
                          ? `${g.lat.toFixed(4)}, ${g.lng.toFixed(4)} ${sourceIcon} ${g.source}`
                          : `❌ Non résolu`;
                      html += `<div class="geo-row">
                          <span class="geo-name" title="${g.name}">${g.name}</span>
                          <span class="geo-addr" title="${g.address}">${g.address || '<i>pas d\'adresse</i>'}</span>
                          <span class="geo-coords ${coordsClass}">${coordsText}</span>
                      </div>`;
                  }
                  reportEl.innerHTML = html;
                  reportEl.style.display = 'block';
              }
          }
          console.log('[Geocoding Report]', geoReport);

          const hasGeoErrors = geoReport.some(g => g.lat == null || g.lng == null);
          const errPanel = document.getElementById('geo_error_panel_content');
          if (errPanel) {
              const title = hasGeoErrors ? '⚠️ Rapport de géocodage' : '📍 Rapport de géocodage';
              let html = `<div class="geo-err-title">${title}</div>`;
              for (const g of geoReport) {
                  const hasCoords = g.lat != null && g.lng != null;
                  const statusCls = hasCoords ? 'ok' : 'fail';
                  const statusText = hasCoords
                      ? `${g.lat.toFixed(4)}, ${g.lng.toFixed(4)} (${g.source})`
                      : '❌ Non résolu';
                  html += `<div class="geo-err-row">
                      <span class="geo-err-name">${g.name}</span>
                      <span class="geo-err-addr" title="${g.address}">${g.address || 'pas d\'adresse'}</span>
                      <span class="geo-err-status ${statusCls}">${statusText}</span>
                  </div>`;
              }
              errPanel.innerHTML = html;
              if (hasGeoErrors) {
                  document.getElementById('geo_error_panel').style.display = 'block';
              }
          }

          const raPanel = document.getElementById('room_assoc_content');
          if (raPanel) {
              const matched = _roomAssocReport.filter(r => r.matched);
              const unmatched = _roomAssocReport.filter(r => !r.matched);
              const hasProblems = unmatched.length > 0;

              let html = `<div class="ra-title">${hasProblems ? '⚠️' : '✅'} Rapport d'association Salles ↔ Datacenters</div>`;
              html += `<div class="ra-section">`;
              html += `<div class="ra-section-title">📊 Résumé</div>`;
              html += `<div class="ra-row"><span class="ra-key">Locations API</span><span class="ra-val">${locationList.length}</span></div>`;
              html += `<div class="ra-row"><span class="ra-key">Datacenters API</span><span class="ra-val">${dcList.length}</span></div>`;
              html += `<div class="ra-row"><span class="ra-key">Associées</span><span class="ra-val ra-ok">${matched.length}</span></div>`;
              html += `<div class="ra-row"><span class="ra-key">Non associées</span><span class="ra-val ${unmatched.length > 0 ? 'ra-fail' : 'ra-ok'}">${unmatched.length}</span></div>`;
              html += `</div>`;

              html += `<div class="ra-section"><div class="ra-section-title">📋 IDs des Datacenters disponibles</div>`;
              for (const dc of dcList) {
                  const dcLocs = locationsByDC[_id(dc)] || [];
                  const cls = dcLocs.length > 0 ? 'ra-ok' : 'ra-warn';
                  html += `<div class="ra-row"><span class="ra-key ${cls}">${_id(dc)}</span><span class="ra-val">${dc.Name || dc.Titre || '?'} → ${dcLocs.length} salle(s)</span></div>`;
              }
              html += `</div>`;

              if (unmatched.length > 0) {
                  html += `<div class="ra-section"><div class="ra-section-title">❌ Locations NON associées</div>`;
                  for (const r of unmatched) {
                      html += `<div style="border-bottom:1px solid rgba(255,255,255,0.05);padding:4px 0;">`;
                      html += `<div class="ra-row"><span class="ra-key">Location</span><span class="ra-val ra-fail">${r.locName} (id: ${r.locId})</span></div>`;
                      html += `<div class="ra-row"><span class="ra-key">SitesId</span><span class="ra-val">${r.SitesId ?? '<i style="color:#666">null</i>'}</span></div>`;
                      html += `<div class="ra-row"><span class="ra-key">DatacentersId</span><span class="ra-val">${r.DatacentersId ?? '<i style="color:#666">null</i>'}</span></div>`;
                      html += `<div class="ra-row"><span class="ra-key">DatacenterId</span><span class="ra-val">${r.DatacenterId ?? '<i style="color:#666">null</i>'}</span></div>`;
                      html += `<div class="ra-row"><span class="ra-key">Résolu vers</span><span class="ra-val ra-fail">${r.resolvedDcId} (pas dans la liste DC)</span></div>`;
                      html += `<div class="ra-row"><span class="ra-key">Clefs ID</span><span class="ra-val" style="font-size:10px;">${r.allKeys}</span></div>`;
                      html += `</div>`;
                  }
                  html += `</div>`;
              }

              if (matched.length > 0) {
                  html += `<div class="ra-section"><div class="ra-section-title">✅ Locations associées</div>`;
                  for (const r of matched) {
                      const dcMatch = dcList.find(d => String(_id(d)) === String(r.resolvedDcId));
                      const dcName = dcMatch ? (dcMatch.Name || dcMatch.Titre) : '?';
                      html += `<div class="ra-row"><span class="ra-key ra-ok">${r.locName}</span><span class="ra-val">→ DC "${dcName}" (${r.resolvedDcId}) via ${r.SitesId ? 'SitesId' : r.DatacentersId ? 'DatacentersId' : 'DatacenterId'}</span></div>`;
                  }
                  html += `</div>`;
              }

              raPanel.innerHTML = html;
              if (hasProblems) {
                  document.getElementById('room_assoc_panel').style.display = 'block';
              }
          }

          return dcConfigs;
      }

      function buildLogicalSites() {
          const defaultZone = {
              name: 'Production',
              class: 'zone',
              style: { childPosition: 'horizontal', minWidth: 12, minDepth: 10 },
              networks: [{
                  name: 'LAN',
                  class: 'network',
                  network: '0.0.0.0/0',
                  style: { childPosition: 'horizontal', color: '#ffffff', minWidth: 20, minDepth: 8 },
                  ips: []
              }]
          };
          return [{
              name: 'Infrastructure',
              class: 'site',
              style: { childPosition: 'horizontal', minWidth: 10 },
              zones: [defaultZone]
          }];
      }

      // Build instances from hosts
      function buildInstances() {
          return hostList
              .filter(h => h.PowerStatus !== 'Off')
              .map(h => ({
                  name: h.Nom || h.Name || ('VM-' + _id(h)),
                  class: 'instance',
                  cpu: h.NbCpu || 2,
                  ram: h.NbRam || 4096,
                  os: h.OsType || 'linux',
                  storage: h.EspaceProvisionne ? Math.round(h.EspaceProvisionne / 1024) : 50,
                  _apiId: _id(h),
                  interfaces: h.IP ? [{
                      class: 'interface',
                      mac: '00:00:00:00:00:00',
                      position: 'front',
                      net: '',
                      ips: [{ class: 'ip', ip: h.IP }],
                      style: { color: '#cccccc' }
                  }] : [],
                  services: [],
                  style: { childPosition: 'horizontal' }
              }));
      }

      if (withLoadingUI) {
          loadingStepActive('build');
          loadingSetStatus('Construction du modèle 3D...');
          loadingSetProgress(90);
      }

      const physDCs = await buildPhysicalDatacenters();
      const logSites = buildLogicalSites();
      const instances = buildInstances();

      const project = {
          sites: logSites,
          instances: instances,
          networkdevices: [],
          physical: { datacenters: physDCs }
      };

      if (withLoadingUI) {
          loadingStepDone('build', `${physDCs.length} DC`);
          loadingSetProgress(100);
          loadingSetStatus('Prêt !');
      }

      console.log(`[Inventory] Built: ${dcList.length} DCs, ${rackList.length} racks, ${deviceList.length} devices, ${hostList.length} hosts`);
      return project;
  }
